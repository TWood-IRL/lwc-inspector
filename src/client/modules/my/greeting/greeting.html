<template>
    <div class="about">
        <template for:each={LABELS.ABOUT_HEADERS} for:item="section">
            <section key={section.KEY} class="slds-card about-card">
                <h2 class="slds-text-heading_medium about-heading">
                    {section.HEADER}
                </h2>
                <template for:each={section.PARAGRAPHS} for:item="paragraph">
                    <p key={paragraph} class="about-text">{paragraph}</p>
                </template>
                <ul lwc:if={section.LIST} class="slds-list_dotted about-text">
                    <template for:each={section.LIST} for:item="entry">
                        <li key={entry}>{entry}</li>
                    </template>
                </ul>
            </section>
        </template>
        <nav class="about-links" aria-label={LABELS.ABOUT_REF}>
            <span class="slds-text-color_weak">{LABELS.ABOUT_REF}:</span>
            <template for:each={LABELS.ABOUT_LINKS} for:item="LINK">
                <a
                    key={LINK.HREF}
                    href={LINK.HREF}
                    target="_blank"
                    rel="noopener noreferrer"
                    >{LINK.TEXT}</a
                >
            </template>
        </nav>
    </div>
</template>
