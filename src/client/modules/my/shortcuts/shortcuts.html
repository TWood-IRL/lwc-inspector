<template>
    <button
        type="button"
        class="trigger"
        aria-label="Keyboard shortcuts"
        aria-haspopup="dialog"
        title="Keyboard shortcuts (?)"
        onclick={toggleHelp}
    >
        <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            focusable="false"
        >
            <path
                fill="currentColor"
                d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM5 8h2v2H5V8zm3 0h2v2H8V8zm3 0h2v2h-2V8zm3 0h2v2h-2V8zm3 0h2v2h-2V8zM5 11h2v2H5v-2zm3 0h2v2H8v-2zm3 0h2v2h-2v-2zm3 0h2v2h-2v-2zm3 0h2v2h-2v-2zM7 17H5v-2h2v2zm10 0H9v-2h8v2zm2 0h-2v-2h2v2z"
            ></path>
        </svg>
        <span class="hint">?</span>
    </button>
    <template lwc:if={open}>
        <div class="backdrop" onclick={handleBackdropClick}>
            <div
                class="dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="shortcuts-title"
            >
                <div class="dialog-header">
                    <h2 id="shortcuts-title" class="dialog-title">
                        Keyboard shortcuts
                    </h2>
                    <button
                        type="button"
                        class="close-button"
                        aria-label="Close keyboard shortcuts"
                        onclick={closeHelp}
                    >
                        &times;
                    </button>
                </div>
                <ul class="list">
                    <template for:each={shortcuts} for:item="s">
                        <li key={s.key} class="row">
                            <kbd class="key">{s.key}</kbd>
                            <span>{s.description}</span>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
    </template>
</template>
