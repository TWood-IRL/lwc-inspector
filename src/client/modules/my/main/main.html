<template>
    <my-header></my-header>

    <lightning-spinner
        lwc:if={isLoading}
        alternative-text={LABEL.LOADING_SPINNER}
        size="large"
        variant="brand"
    ></lightning-spinner>
    <main class="main-html">
        <template lwc:if={isLoggedIn}>
            <div class="account-bar">
                <p class="account-text">
                    {LABEL.LOGGED_IN_AS} <strong>{getName}</strong>
                    <span lwc:if={getUsername} class="slds-text-color_weak">
                        ({getUsername})</span
                    >
                </p>
                <a class="slds-button slds-button_neutral" href="/oauth2/logout"
                    >Log out</a
                >
            </div>
            <my-app onloading={toggleLoading}></my-app>
        </template>
        <template lwc:else>
            <section class="slds-card login-card">
                <div class="slds-card__body slds-card__body_inner">
                    <svg
                        class="hero-icon"
                        viewBox="0 0 64 64"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <defs>
                            <linearGradient
                                id="hero-g"
                                x1="0"
                                y1="0"
                                x2="1"
                                y2="1"
                            >
                                <stop offset="0" stop-color="#1b96ff"></stop>
                                <stop offset="1" stop-color="#014486"></stop>
                            </linearGradient>
                        </defs>
                        <rect
                            width="64"
                            height="64"
                            rx="16"
                            fill="url(#hero-g)"
                        ></rect>
                        <circle
                            cx="27"
                            cy="27"
                            r="11"
                            fill="none"
                            stroke="#fff"
                            stroke-width="4"
                        ></circle>
                        <path
                            d="M35 35l12 12"
                            stroke="#fff"
                            stroke-width="4"
                            stroke-linecap="round"
                        ></path>
                        <path
                            d="M23 27l3 3 6-6"
                            fill="none"
                            stroke="#fff"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ></path>
                    </svg>
                    <p class="tagline">{LABEL.TAGLINE}</p>
                    <div class="login-actions">
                        <a
                            class="slds-button slds-button_brand"
                            href="/oauth2/login?login_type=PRODUCTION"
                            >{LABEL.LOGIN_PROD}</a
                        >
                        <a
                            class="slds-button slds-button_neutral"
                            href="/oauth2/login?login_type=SANDBOX"
                            >{LABEL.LOGIN_SANDBOX}</a
                        >
                        <button
                            type="button"
                            class="slds-button slds-button_neutral session-toggle"
                            aria-expanded={displayInputs}
                            onclick={setDisplayInputs}
                        >
                            {LABEL.LOGIN_SESSIONID}
                        </button>
                    </div>
                    <div lwc:if={displayInputs} class="session-form">
                        <lightning-input
                            type="text"
                            data-id="sessionId"
                            label={LABEL.ENTER_SESSION}
                            placeholder={LABEL.PLACEHOLDER_SESSION}
                            value=""
                        ></lightning-input>
                        <lightning-input
                            type="text"
                            data-id="myDomainURL"
                            placeholder={LABEL.PLACEHOLDER_MYDOMAIN}
                            label={LABEL.ENTER_MY_DOMAIN}
                            value=""
                        ></lightning-input>
                        <lightning-button
                            class="slds-m-top_small"
                            variant="brand"
                            label={LABEL.SET_SESSION}
                            onclick={setSessionInfo}
                        ></lightning-button>
                    </div>
                </div>
            </section>
            <my-greeting lwc:if={showGreeting}></my-greeting>
        </template>
    </main>
</template>
