<template>
    <div class={getComputedClass} lwc:if={isDisplayed}>
        <div class="slds-notify_container">
            <div
                class={toastClass}
                role="status"
                onmouseenter={handlePause}
                onmouseleave={handleResume}
            >
                <span class="slds-assistive-text">{variantLabel}</span>
                <span
                    class="slds-icon_container slds-m-right_small slds-no-flex slds-align-top toast-icon"
                >
                    <svg class="slds-icon slds-icon_small" aria-hidden="true">
                        <use xlink:href={iconHref}></use>
                    </svg>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small">
                        {toastNotification.title}
                    </h2>
                    <p lwc:if={isMessage}>{toastNotification.message}</p>
                </div>
                <div class="slds-notify__close">
                    <button
                        class="slds-button slds-button_icon slds-button_icon-inverse"
                        title="Close"
                        onclick={handleClose}
                    >
                        <svg
                            class="slds-button__icon slds-button__icon_large"
                            aria-hidden="true"
                        >
                            <use
                                xlink:href="/resources/slds/icons/utility-sprite/svg/symbols.svg#close"
                            ></use>
                        </svg>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </div>
                <span class="toast-progress" style={progressStyle}></span>
            </div>
        </div>
    </div>
</template>
