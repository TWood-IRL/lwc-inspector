<template>
    <section class={explorerClass}>
        <div class="slds-card search-card">
            <div class="search-row">
                <div class="search-input">
                    <lightning-input
                        type="search"
                        label="Search components"
                        placeholder="Search by name"
                        value={searchKey}
                        onkeyup={handleSearchKeyup}
                        onchange={handleSearchChange}
                    ></lightning-input>
                </div>
                <lightning-radio-group
                    label="Component type"
                    type="button"
                    options={compTypes}
                    value={compTypeValue}
                    onchange={executeSearch}
                ></lightning-radio-group>
                <lightning-button
                    variant="brand"
                    label="Search"
                    onclick={executeSearch}
                ></lightning-button>
                <lightning-button-icon
                    class="refresh-button"
                    icon-name="utility:refresh"
                    alternative-text="Refresh components"
                    title="Refresh (bypass cache)"
                    disabled={refreshDisabled}
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>
            <p lwc:if={freshnessLabel} class="freshness" aria-live="polite">
                {freshnessLabel}
            </p>
            <div lwc:if={offline} class="offline-banner" role="status">
                You are offline. Showing cached data where available.
            </div>
        </div>

        <div lwc:if={showSkeleton} class="panes">
            <div class="pane-tree">
                <div class="slds-card pane component-tree">
                    <my-skeleton variant="tree" rows="10"></my-skeleton>
                </div>
            </div>
            <div class="pane-source">
                <my-skeleton variant="code" rows="12"></my-skeleton>
            </div>
        </div>
        <div lwc:if={showLoadError} class="slds-card">
            <my-error-state
                title="Unable to load components"
                message={loadError}
                onretry={handleRetry}
            ></my-error-state>
        </div>

        <my-recent-chips
            lwc:if={hasRecents}
            items={recents}
            onselect={handleRecentSelect}
            onclear={handleRecentsClear}
        ></my-recent-chips>

        <div lwc:if={isComponents} class="layout-bar">
            <button
                lwc:if={showTreeToggle}
                type="button"
                class="layout-button"
                aria-expanded={treeExpanded}
                aria-label={treeToggleLabel}
                title={treeToggleLabel}
                onclick={handleTreeToggle}
            >
                <svg
                    class={chevronClass}
                    viewBox="0 0 20 20"
                    width="16"
                    height="16"
                    aria-hidden="true"
                >
                    <path
                        d="M12.5 4.5L7 10l5.5 5.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                <span>Tree</span>
            </button>
            <button
                type="button"
                class="layout-button"
                aria-pressed={isFocusMode}
                title={focusTitle}
                onclick={handleFocusToggle}
            >
                {focusLabel}
            </button>
        </div>

        <div lwc:if={isComponents} class="panes">
            <div class={treeClass} style={treeStyle}>
                <div class="slds-card pane component-tree">
                    <h2 class="list-header">{listHeader}</h2>
                    <ul class="component-list">
                        <template for:each={componentList} for:item="component">
                            <li key={component.id}>
                                <button
                                    type="button"
                                    class={component.className}
                                    data-index={component.index}
                                    aria-current={component.selected}
                                    onclick={handleSelectComponent}
                                >
                                    <span class="component-name"
                                        >{component.label}</span
                                    >
                                    <span
                                        lwc:if={component.managed}
                                        class="component-badge"
                                        >Managed</span
                                    >
                                </button>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
            <my-splitter
                lwc:if={showSplitter}
                value={treeWidth}
                min={minTreeWidth}
                max={maxTreeWidthValue}
                onresize={handleSplitterResize}
                onreset={handleSplitterReset}
            ></my-splitter>
            <div class="pane-source">
                <my-skeleton
                    lwc:if={loadingItems}
                    variant="code"
                    rows="12"
                    label="Loading component files"
                ></my-skeleton>
                <div lwc:elseif={itemError} class="slds-card pane">
                    <my-error-state
                        title="Unable to load component files"
                        message={itemError}
                        onretry={handleItemRetry}
                    ></my-error-state>
                </div>
                <div lwc:elseif={isTypeSource} class="editor">
                    <div class="editor-bar">
                        <div
                            class="tabs"
                            role="tablist"
                            aria-label="Component files"
                        >
                            <template for:each={fileTabs} for:item="tab">
                                <button
                                    key={tab.name}
                                    type="button"
                                    role="tab"
                                    class={tab.className}
                                    title={tab.title}
                                    aria-selected={tab.selected}
                                    tabindex={tab.tabIndex}
                                    data-name={tab.name}
                                    onclick={handleTabClick}
                                    onkeydown={handleTabKeydown}
                                >
                                    {tab.label}
                                </button>
                            </template>
                        </div>
                        <div class="editor-actions">
                            <button
                                type="button"
                                class="editor-button compare-button"
                                title="Compare two files"
                                aria-pressed={comparing}
                                onclick={handleCompare}
                            >
                                Compare
                            </button>
                            <button
                                type="button"
                                class={copyClass}
                                title="Copy your selection, or the whole file"
                                onclick={handleCopy}
                            >
                                {copyLabel}
                            </button>
                            <button
                                type="button"
                                class={copyLinkClass}
                                title="Copy a link to this file"
                                onclick={handleCopyLink}
                            >
                                {copyLinkLabel}
                            </button>
                            <button
                                type="button"
                                class="editor-button"
                                title="Download this file"
                                onclick={handleDownloadFile}
                            >
                                Download file
                            </button>
                            <button
                                type="button"
                                class="editor-button"
                                title="Download the whole component as a zip"
                                onclick={handleDownload}
                            >
                                Download .zip
                            </button>
                        </div>
                    </div>
                    <my-diff-view
                        lwc:if={comparing}
                        files={compareFiles}
                        initial-left={selectedFileName}
                        onexit={handleCompareExit}
                    ></my-diff-view>
                    <my-component-insights
                        lwc:if={viewing}
                        files={insightFiles}
                        oninsightselect={handleInsightSelect}
                    ></my-component-insights>
                    <my-code-viewer
                        lwc:if={viewing}
                        code={getSource}
                        file-name={getSourceLabel}
                        format={getSourceFormat}
                    ></my-code-viewer>
                </div>
                <div lwc:else class="slds-card pane">
                    <div class="empty-state">
                        <svg
                            class="empty-icon"
                            viewBox="0 0 64 64"
                            width="56"
                            height="56"
                            aria-hidden="true"
                        >
                            <rect
                                x="8"
                                y="10"
                                width="48"
                                height="44"
                                rx="6"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="3"
                            />
                            <path
                                d="M8 22h48"
                                stroke="currentColor"
                                stroke-width="3"
                            />
                            <path
                                d="M26 33l-6 6 6 6M38 33l6 6-6 6"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="3"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <p class="empty-title">No component selected</p>
                        <p class="slds-text-color_weak">
                            Choose a component from the list to view its source.
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <div lwc:if={showEmptyState} class="slds-card empty-state">
            <svg
                class="empty-icon"
                viewBox="0 0 64 64"
                width="56"
                height="56"
                aria-hidden="true"
            >
                <circle
                    cx="28"
                    cy="28"
                    r="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                />
                <path
                    d="M40 40l14 14"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                />
                <path
                    d="M22 28h12"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                />
            </svg>
            <p class="empty-title">No components found</p>
            <p class="slds-text-color_weak">
                Try a different search term or component type.
            </p>
        </div>
    </section>
</template>
