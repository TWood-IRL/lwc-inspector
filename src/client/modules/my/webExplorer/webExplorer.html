<template>
    <section class="explorer">
        <div class="slds-card search-card">
            <div class="search-row">
                <div class="search-input">
                    <lightning-input
                        type="search"
                        label="Search components"
                        placeholder="Search by name"
                        value={searchKey}
                        onkeyup={handleSearchKeyup}
                    ></lightning-input>
                </div>
                <lightning-radio-group
                    label="Component type"
                    type="button"
                    options={compTypes}
                    value={compTypeValue}
                    onchange={executeSearch}
                ></lightning-radio-group>
                <lightning-button
                    variant="brand"
                    label="Search"
                    onclick={executeSearch}
                ></lightning-button>
            </div>
        </div>

        <my-recent-chips
            lwc:if={hasRecents}
            items={recents}
            onselect={handleRecentSelect}
            onclear={handleRecentsClear}
        ></my-recent-chips>

        <div lwc:if={isComponents} class="panes">
            <div class="pane-tree">
                <div class="slds-card pane component-tree">
                    <c-tree
                        items={components}
                        header={treeHeader}
                        selected-item={selectedFileName}
                        onselect={handleOnselect}
                    ></c-tree>
                </div>
            </div>
            <div class="pane-source">
                <div lwc:if={isTypeSource} class="editor">
                    <div class="editor-bar">
                        <div
                            class="tabs"
                            role="group"
                            aria-label="Component files"
                        >
                            <template for:each={fileTabs} for:item="tab">
                                <button
                                    key={tab.name}
                                    type="button"
                                    class={tab.className}
                                    title={tab.title}
                                    aria-pressed={tab.selected}
                                    data-name={tab.name}
                                    onclick={handleTabClick}
                                >
                                    {tab.label}
                                </button>
                            </template>
                        </div>
                        <div class="editor-actions">
                            <button
                                type="button"
                                class={copyClass}
                                title="Copy source to clipboard"
                                onclick={handleCopy}
                            >
                                {copyLabel}
                            </button>
                            <button
                                type="button"
                                class={copyLinkClass}
                                title="Copy a link to this file"
                                onclick={handleCopyLink}
                            >
                                {copyLinkLabel}
                            </button>
                            <button
                                type="button"
                                class="editor-button"
                                title="Download the whole component as a zip"
                                onclick={handleDownload}
                            >
                                Download .zip
                            </button>
                        </div>
                    </div>
                    <my-component-insights
                        files={insightFiles}
                        oninsightselect={handleInsightSelect}
                    ></my-component-insights>
                    <my-code-viewer
                        code={getSource}
                        file-name={getSourceLabel}
                        format={getSourceFormat}
                    ></my-code-viewer>
                </div>
                <div lwc:else class="slds-card pane">
                    <div class="empty-state">
                        <svg
                            class="empty-icon"
                            viewBox="0 0 64 64"
                            width="56"
                            height="56"
                            aria-hidden="true"
                        >
                            <rect
                                x="8"
                                y="10"
                                width="48"
                                height="44"
                                rx="6"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="3"
                            />
                            <path
                                d="M8 22h48"
                                stroke="currentColor"
                                stroke-width="3"
                            />
                            <path
                                d="M26 33l-6 6 6 6M38 33l6 6-6 6"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="3"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <p class="empty-title">No file selected</p>
                        <p class="slds-text-color_weak">
                            Choose a component in the tree, then pick a file to
                            view its source.
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <div lwc:if={showEmptyState} class="slds-card empty-state">
            <svg
                class="empty-icon"
                viewBox="0 0 64 64"
                width="56"
                height="56"
                aria-hidden="true"
            >
                <circle
                    cx="28"
                    cy="28"
                    r="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                />
                <path
                    d="M40 40l14 14"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                />
                <path
                    d="M22 28h12"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                />
            </svg>
            <p class="empty-title">No components found</p>
            <p class="slds-text-color_weak">
                Try a different search term or component type.
            </p>
        </div>
    </section>
</template>
