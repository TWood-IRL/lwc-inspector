<template>
    <section class="explorer">
        <div class="slds-card search-card">
            <div class="search-row">
                <div class="search-input">
                    <lightning-input
                        type="search"
                        label="Search components"
                        placeholder="Search by name"
                        value={searchKey}
                        onkeyup={handleSearchKeyup}
                    ></lightning-input>
                </div>
                <lightning-radio-group
                    label="Component type"
                    type="button"
                    options={compTypes}
                    value={compTypeValue}
                    onchange={executeSearch}
                ></lightning-radio-group>
                <lightning-button
                    variant="brand"
                    label="Search"
                    onclick={executeSearch}
                ></lightning-button>
            </div>
        </div>

        <div lwc:if={isComponents} class="panes">
            <div class="pane-tree">
                <div class="slds-card pane component-tree">
                    <c-tree
                        items={components}
                        header={treeHeader}
                        onselect={handleOnselect}
                    ></c-tree>
                </div>
            </div>
            <div class="pane-source">
                <div class="slds-card pane">
                    <template lwc:if={isTypeSource}>
                        <div class="source-header">
                            <span class="source-title" title={getSourceLabel}
                                >{getSourceLabel}</span
                            >
                            <div class="source-actions">
                                <lightning-button
                                    variant="neutral"
                                    label="Copy"
                                    title="Copy source to clipboard"
                                    onclick={handleCopy}
                                ></lightning-button>
                                <lightning-button
                                    variant="brand"
                                    label="Download .zip"
                                    title="Download the whole component"
                                    onclick={handleDownload}
                                ></lightning-button>
                            </div>
                        </div>
                        <pre
                            class="sourceCode"
                            tabindex="0"
                            aria-label="Source code"
                        ><code>{getSource}</code></pre>
                    </template>
                    <template lwc:else>
                        <div class="empty-state">
                            <p class="empty-title">No file selected</p>
                            <p class="slds-text-color_weak">
                                Choose a component in the tree, then pick a file
                                to view its source.
                            </p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <div lwc:if={showEmptyState} class="slds-card empty-state">
            <p class="empty-title">No components found</p>
            <p class="slds-text-color_weak">
                Try a different search term or component type.
            </p>
        </div>
    </section>
</template>
