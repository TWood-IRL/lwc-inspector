<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>LWC Inspector</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="View and download the source of Lightning Web Components in any Salesforce org."
        />
        <meta name="theme-color" content="#0176d3" />
        <meta name="color-scheme" content="light dark" />
        <script>
            // Apply the theme before first paint (logic mirrors my/theme)
            (function () {
                var theme;
                try {
                    theme = localStorage.getItem('lwci-theme');
                } catch (e) {}
                if (theme !== 'light' && theme !== 'dark') {
                    theme =
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)')
                            .matches
                            ? 'dark'
                            : 'light';
                }
                var root = document.documentElement;
                root.setAttribute('data-theme', theme);
                root.style.colorScheme = theme;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    meta.setAttribute(
                        'content',
                        theme === 'dark' ? '#014486' : '#0176d3'
                    );
                }
            })();
        </script>
        <style>
            :root {
                --lwci-brand: #0176d3;
                --lwci-brand-dark: #014486;
                --lwci-ink: #181818;
                --lwci-ink-weak: #5c5c5c;
                --lwci-surface: #ffffff;
                --lwci-surface-alt: #f4f6fa;
                --lwci-bg: #f4f6fa;
                --lwci-bg-glow: #dcecfb;
                --lwci-hover: #eef4fb;
                --lwci-link: #014486;
                --lwci-border: #e3e6ec;
                --lwci-code-bg: #1e1e1e;
                --lwci-focus: #1b96ff;
                --lwci-scroll: #c1c9d4;
                --lwci-radius: 0.75rem;
                --lwci-font:
                    'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
                --lwci-mono:
                    ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas,
                    monospace;
                --lwci-text-xs: 0.75rem;
                --lwci-text-sm: 0.8125rem;
                --lwci-text-md: 0.9375rem;
                --lwci-text-lg: 1.125rem;
                --lwci-shadow:
                    0 1px 2px rgba(16, 24, 40, 0.06),
                    0 4px 12px rgba(16, 24, 40, 0.06);
            }
            :root[data-theme='dark'] {
                --lwci-ink: #e8ecf2;
                --lwci-ink-weak: #a9b4c4;
                --lwci-surface: #1a212b;
                --lwci-surface-alt: #151b24;
                --lwci-bg: #0f141b;
                --lwci-bg-glow: #12304f;
                --lwci-hover: #243044;
                --lwci-link: #6cb7ff;
                --lwci-border: #333f50;
                --lwci-code-bg: #11151b;
                --lwci-focus: #7cc0ff;
                --lwci-scroll: #44505f;
                --lwci-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.35);
            }
            body {
                margin: 0;
                min-height: 100vh;
                color: var(--lwci-ink);
                background:
                    radial-gradient(
                        60rem 24rem at 50% -8rem,
                        var(--lwci-bg-glow) 0%,
                        transparent 100%
                    ),
                    var(--lwci-bg);
                font-family: var(--lwci-font);
                font-size: var(--lwci-text-md);
                line-height: 1.5;
                text-rendering: optimizeLegibility;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                animation: lwci-fade-in 0.4s ease-out both;
            }
            @keyframes lwci-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            h1,
            h2,
            h3 {
                letter-spacing: -0.01em;
                text-wrap: balance;
            }
            code,
            pre,
            kbd {
                font-family: var(--lwci-mono);
            }
            ::selection {
                background: rgba(27, 150, 255, 0.3);
                color: inherit;
            }
            html {
                scroll-behavior: smooth;
                scrollbar-width: thin;
                scrollbar-color: var(--lwci-scroll) transparent;
            }
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--lwci-scroll);
                border: 2px solid transparent;
                background-clip: content-box;
                border-radius: 999px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--lwci-ink-weak);
                background-clip: content-box;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            a:focus-visible,
            button:focus-visible {
                outline: 2px solid var(--lwci-focus);
                outline-offset: 2px;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }
            @media (max-width: 480px) {
                .slds-card {
                    border-radius: 0.5rem;
                }
            }
            .slds-card {
                border: 1px solid var(--lwci-border);
                border-radius: var(--lwci-radius);
                box-shadow: var(--lwci-shadow);
            }
            /* Dark theme overrides for SLDS components */
            [data-theme='dark'] .slds-card,
            [data-theme='dark'] .slds-card__header-title,
            [data-theme='dark'] .slds-text-heading_small,
            [data-theme='dark'] .slds-text-heading_medium,
            [data-theme='dark'] .slds-form-element__label,
            [data-theme='dark'] .slds-radio .slds-form-element__label {
                color: var(--lwci-ink);
            }
            [data-theme='dark'] .slds-card {
                background: var(--lwci-surface);
            }
            [data-theme='dark'] .slds-tree__item,
            [data-theme='dark'] .slds-tree__item a {
                color: var(--lwci-ink);
            }
            [data-theme='dark'] .slds-text-color_weak,
            [data-theme='dark'] .slds-form-element__help {
                color: var(--lwci-ink-weak);
            }
            [data-theme='dark'] .slds-input,
            [data-theme='dark'] .slds-textarea,
            [data-theme='dark'] .slds-select {
                background: var(--lwci-surface-alt);
                border-color: #5b6879;
                color: var(--lwci-ink);
            }
            [data-theme='dark'] .slds-input::placeholder {
                color: var(--lwci-ink-weak);
            }
            [data-theme='dark'] .slds-input:focus,
            [data-theme='dark'] .slds-input:active {
                border-color: var(--lwci-focus);
                box-shadow: 0 0 3px var(--lwci-focus);
            }
            [data-theme='dark'] .slds-radio .slds-radio_faux {
                background: var(--lwci-surface-alt);
                border-color: #5b6879;
            }
            [data-theme='dark']
                .slds-radio
                [type='radio']:checked
                + .slds-radio__label
                .slds-radio_faux,
            [data-theme='dark']
                .slds-radio
                [type='radio']:checked
                ~ .slds-radio__label
                .slds-radio_faux {
                background: var(--lwci-surface-alt);
                border-color: var(--lwci-focus);
            }
            [data-theme='dark']
                .slds-radio
                [type='radio']:focus
                + .slds-radio__label
                .slds-radio_faux {
                border-color: var(--lwci-focus);
                box-shadow: 0 0 3px var(--lwci-focus);
            }
            [data-theme='dark'] .slds-button_neutral {
                background: var(--lwci-surface-alt);
                border-color: #5b6879;
                color: var(--lwci-link);
            }
            [data-theme='dark'] .slds-button_neutral:hover,
            [data-theme='dark'] .slds-button_neutral:focus {
                background: var(--lwci-hover);
            }
            [data-theme='dark'] .slds-button_brand {
                background: #0b5cab;
                border-color: #0b5cab;
                color: #ffffff;
            }
            [data-theme='dark'] .slds-button_brand:hover,
            [data-theme='dark'] .slds-button_brand:focus {
                background: #0a4f94;
                border-color: #0a4f94;
            }
        </style>
        <link rel="shortcut icon" href="resources/favicon.ico" />
        <link
            rel="stylesheet"
            href="/resources/slds/styles/salesforce-lightning-design-system.min.css"
        />

        <!-- Google Tag Manager -->
        <script id="gtmSnippet"></script>
        <script type="module" src="/resources/app.js"></script>
        <!-- End Google Tag Manager -->
    </head>
    <body>
        <!-- Google Tag Manager (noscript) -->
        <noscript
            ><iframe
                src="https://www.googletagmanager.com/ns.html?id=GTM-W4JMV84"
                height="0"
                width="0"
                style="display: none; visibility: hidden"
            ></iframe
        ></noscript>
        <!-- End Google Tag Manager (noscript) -->
        <div id="main"></div>
    </body>
</html>
