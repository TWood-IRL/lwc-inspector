<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>LWC Inspector</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="View and download the source of Lightning Web Components in any Salesforce org."
        />
        <meta name="theme-color" content="#0176d3" />
        <style>
            :root {
                --lwci-brand: #0176d3;
                --lwci-brand-dark: #014486;
                --lwci-ink: #181818;
                --lwci-ink-weak: #5c5c5c;
                --lwci-surface: #ffffff;
                --lwci-border: #e3e6ec;
                --lwci-radius: 0.75rem;
                --lwci-font:
                    'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
                --lwci-mono:
                    ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas,
                    monospace;
                --lwci-text-xs: 0.75rem;
                --lwci-text-sm: 0.8125rem;
                --lwci-text-md: 0.9375rem;
                --lwci-text-lg: 1.125rem;
                --lwci-shadow:
                    0 1px 2px rgba(16, 24, 40, 0.06),
                    0 4px 12px rgba(16, 24, 40, 0.06);
            }
            body {
                margin: 0;
                min-height: 100vh;
                color: var(--lwci-ink);
                background:
                    radial-gradient(
                        60rem 24rem at 50% -8rem,
                        #dcecfb 0%,
                        rgba(220, 236, 251, 0) 100%
                    ),
                    #f4f6fa;
                font-family: var(--lwci-font);
                font-size: var(--lwci-text-md);
                line-height: 1.5;
                text-rendering: optimizeLegibility;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                animation: lwci-fade-in 0.4s ease-out both;
            }
            @keyframes lwci-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            h1,
            h2,
            h3 {
                letter-spacing: -0.01em;
                text-wrap: balance;
            }
            code,
            pre,
            kbd {
                font-family: var(--lwci-mono);
            }
            ::selection {
                background: rgba(1, 118, 211, 0.22);
                color: inherit;
            }
            html {
                scroll-behavior: smooth;
                scrollbar-width: thin;
                scrollbar-color: #b7c0cf transparent;
            }
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }
            ::-webkit-scrollbar-thumb {
                background: #c3cad6;
                border: 2px solid transparent;
                background-clip: content-box;
                border-radius: 999px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #9aa5b8;
                background-clip: content-box;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            a:focus-visible,
            button:focus-visible {
                outline: 2px solid #1b96ff;
                outline-offset: 2px;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }
            @media (max-width: 480px) {
                .slds-card {
                    border-radius: 0.5rem;
                }
            }
            .slds-card {
                border: 1px solid var(--lwci-border);
                border-radius: var(--lwci-radius);
                box-shadow: var(--lwci-shadow);
            }
        </style>
        <link rel="shortcut icon" href="resources/favicon.ico" />
        <link
            rel="stylesheet"
            href="/resources/slds/styles/salesforce-lightning-design-system.min.css"
        />

        <!-- Google Tag Manager -->
        <script id="gtmSnippet"></script>
        <script type="module" src="/resources/app.js"></script>
        <!-- End Google Tag Manager -->
    </head>
    <body>
        <!-- Google Tag Manager (noscript) -->
        <noscript
            ><iframe
                src="https://www.googletagmanager.com/ns.html?id=GTM-W4JMV84"
                height="0"
                width="0"
                style="display: none; visibility: hidden"
            ></iframe
        ></noscript>
        <!-- End Google Tag Manager (noscript) -->
        <div id="main"></div>
    </body>
</html>
